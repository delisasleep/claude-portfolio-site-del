<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact — Del Beanlands</title>
  <meta name="description" content="Get in touch with Del Beanlands for design work, collaborations, and inquiries." />
  <link rel="canonical" href="https://example.com/contact.html" />
  <meta name="robots" content="index, follow" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="Contact — Del Beanlands" />
  <meta property="og:description" content="Get in touch for design work, collaborations, and inquiries." />
  <meta property="og:url" content="https://example.com/contact.html" />
  <meta property="og:image" content="https://example.com/assets/img/social-share.png" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="assets/img/favicon.png" />
  <link rel="stylesheet" href="css/contact.css" />
</head>
<body class="contact-paper">

  <!-- SVG filter that gives the paper its torn/ragged outer edges.
       Applied to the page's ::before (paper layer) only, so the text
       stays perfectly crisp. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <filter id="paper-tear" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.016" numOctaves="3" seed="8" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>

  <a class="paper-back" href="index.html" title="Back to the room" aria-label="Back to the room">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    the room
  </a>

  <main class="desk">
    <div class="book">
      <section class="page">
        <h1 class="visually-hidden" style="position:absolute;left:-9999px;">Contact Del Beanlands</h1>

        <!-- ============================================================
             AVAILABILITY TOGGLE
             Flip ACCEPTING_REQUESTS (bottom of this file) to false when
             you don't want new requests — swaps the heading area to a
             "sorry" message and greys out + locks the form. Flip back
             to true to reopen. Nothing else needs to change.
             ============================================================ -->
        <div id="openHead">
          <p class="paper-formhead">Leave a note</p>
          <p class="paper-sub">Goes straight to my inbox &mdash; no newsletters, promise.</p>
        </div>
        <p id="closedNotice" class="closed-notice" hidden>Sorry, I am unable to take requests at the moment.</p>

        <div id="formBody">
          <!-- ============================================================
               Plain HTML form, submitted to HubSpot's Forms Submission
               API via fetch() (no iframe) so it can keep this page's own
               styling. Portal 343510042, form d3d7c5a3-cb9f-42df-8a25-
               d047457a101f, region na3.

               HubSpot's internal field names (confirmed Aug 6, 2026):
                 First Name    -> firstname
                 Email         -> email
                 Phone Number  -> phone
                 Message       -> message
                 Request Type  -> type
               See FIELD_MAP in the script near the bottom of this file
               if these ever need to change (e.g. a new/renamed field).
               ============================================================ -->
          <form class="paper-hs-form" id="noteForm" novalidate>
            <div class="paper-field">
              <label for="pName">Name</label>
              <input id="pName" name="name" type="text" placeholder="Your name" autocomplete="name" required />
            </div>
            <div class="paper-field">
              <label for="pEmail">Email</label>
              <input id="pEmail" name="email" type="email" placeholder="you@studio.com" autocomplete="email" required />
            </div>
            <div class="paper-field">
              <label for="pPhone">Phone <span class="optional-tag">(optional)</span></label>
              <input id="pPhone" name="phone" type="tel" placeholder="(555) 555-5555" autocomplete="tel" />
            </div>
            <div class="paper-field">
              <span class="paper-field-label">What's this about?</span>
              <div class="paper-radio-group" role="radiogroup" aria-label="What's this about?">
                <label class="paper-radio">
                  <input type="radio" name="requestType" value="Web dev project" checked />
                  Web dev project
                </label>
                <label class="paper-radio">
                  <input type="radio" name="requestType" value="Design project" />
                  Design project
                </label>
                <label class="paper-radio">
                  <input type="radio" name="requestType" value="Other inquiry" />
                  Other inquiry
                </label>
              </div>
            </div>
            <div class="paper-field">
              <label for="pMsg">Message</label>
              <textarea id="pMsg" name="message" placeholder="Tell me about it&hellip;" required></textarea>
            </div>

            <!-- Honeypot — invisible to real visitors, but bots that
                 auto-fill every field tend to fill this too. If it's
                 non-empty on submit, we quietly drop the request instead
                 of sending it to HubSpot. Not a real "field" to anyone
                 using a mouse, keyboard, or screen reader. -->
            <div class="hp-field" aria-hidden="true">
              <label for="hpField">Leave this field blank</label>
              <input id="hpField" name="hp_field" type="text" tabindex="-1" autocomplete="off" />
            </div>

            <button class="paper-send" type="submit" id="sendBtn">
              <span id="sendBtnText">Send it</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
            <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
          </form>

          <p class="response-note"><em>*responses can take 1-3 business days*</em></p>
        </div>
      </section>
    </div>
  </main>

  <script>
    // ============================================================
    // AVAILABILITY TOGGLE — the only line you need to touch.
    // true  = form is open, normal heading shows.
    // false = "Sorry, I am unable to take requests at the moment."
    //         replaces the heading, and the form greys out + becomes
    //         unclickable/untabbable.
    // ============================================================
    const ACCEPTING_REQUESTS = true;

    (function () {
      const openHead = document.getElementById("openHead");
      const notice = document.getElementById("closedNotice");
      const formBody = document.getElementById("formBody");
      if (ACCEPTING_REQUESTS) return;
      openHead.hidden = true;
      notice.hidden = false;
      formBody.classList.add("is-closed");
      formBody.inert = true; // blocks clicks/tab/screen-readers
    })();
  </script>

  <script>
    // ============================================================
    // HubSpot Forms Submission API — posts this plain form straight
    // to HubSpot, no iframe. See the big comment above the <form> for
    // how to fix the field-name mapping if submissions aren't landing
    // as contacts in HubSpot.
    // ============================================================
    const HUBSPOT_PORTAL_ID = "343510042";
    const HUBSPOT_FORM_ID = "d3d7c5a3-cb9f-42df-8a25-d047457a101f";
    const HUBSPOT_REGION = "na3";

    // Maps our field's `name` attribute -> HubSpot's internal field name +
    // which CRM object it belongs to. Confirmed Aug 6, 2026. HubSpot
    // requires objectTypeId per field once a form mixes object types —
    // "type" (Request Type) turned out to be a Company property
    // (objectTypeId 0-2), not a Contact one (0-1), which is what the
    // earlier "Required field '0-2/type' is missing" error meant.
    const FIELD_MAP = {
      name:        { hsName: "firstname", objectTypeId: "0-1" },
      email:       { hsName: "email",     objectTypeId: "0-1" },
      phone:       { hsName: "phone",     objectTypeId: "0-1" },
      requestType: { hsName: "type",      objectTypeId: "0-2" },
      message:     { hsName: "message",   objectTypeId: "0-1" }
    };

    document.getElementById("noteForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById("sendBtn");
      const btnText = document.getElementById("sendBtnText");
      const status = document.getElementById("formStatus");

      // Honeypot check — a bot filled in a field a real visitor never
      // sees. Pretend it worked (so the bot doesn't learn to skip this
      // field) but never actually contact HubSpot.
      if (form.elements["hp_field"].value.trim() !== "") {
        form.reset();
        status.textContent = "Sent — thank you! I'll get back to you soon.";
        status.className = "form-status is-success";
        return;
      }

      const fields = Object.entries(FIELD_MAP).map(([localName, cfg]) => ({
        objectTypeId: cfg.objectTypeId,
        name: cfg.hsName,
        value: form.elements[localName].value
      }));

      btn.disabled = true;
      btnText.textContent = "Sending…";
      status.textContent = "";
      status.className = "form-status";

      try {
        // HubSpot rejects context.pageUri if it isn't a real http(s) URL —
        // when this file is opened directly (file:///...), as during local
        // testing, that field is left out rather than sent invalid.
        const context = { pageName: document.title };
        if (location.protocol === "http:" || location.protocol === "https:") {
          context.pageUri = window.location.href;
        }

        const res = await fetch(
          `https://api.hsforms.com/submissions/v3/integration/submit/${HUBSPOT_PORTAL_ID}/${HUBSPOT_FORM_ID}`,
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ fields, context })
          }
        );
        if (!res.ok) {
          const body = await res.text().catch(() => "");
          console.error("HubSpot submission failed:", res.status, body);
          throw new Error("HubSpot rejected the submission (" + res.status + ")");
        }
        form.reset();
        btnText.textContent = "Send it";
        status.textContent = "Sent — thank you! I'll get back to you soon.";
        status.classList.add("is-success");
      } catch (err) {
        btnText.textContent = "Send it";
        status.innerHTML = 'Something went wrong — mind <a href="mailto:deljinderb025@gmail.com">emailing me directly</a> instead?';
        status.classList.add("is-error");
      } finally {
        btn.disabled = false;
      }
    });
  </script>

</body>
</html>
